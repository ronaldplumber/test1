<!DOCTYPE html>
<html lang="en">
<head>
  <title>Event Handling</title>
  <style>
    .box { width: 220px; padding: 20px; margin: 10px 0; border: 2px solid #333; text-align: center; cursor: pointer; }
    .clicked { background: lightgreen; }
    .hovered { background: yellow; }
    #eventLog { margin-top: 20px; padding: 10px; border: 1px dashed #999; }
  </style>
</head>
<body>
  <h1>Event Handling for Automation</h1>
  <div id="clickBox" class="box">Click me</div>
  <div id="hoverBox" class="box">Hover over me</div>
  <div id="dblBox" class="box">Double click me</div>
  <button id="resetBtn">Reset</button>
  <button id="simulateBtn">Simulate</button>
  <div id="eventLog"></div>
    <script src="day25event.js"></script>
</body>
</html>
